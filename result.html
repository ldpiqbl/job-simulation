    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {

        }

        .gradient-bg {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
        }

        .skill-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin: 4px;
        }

        .skill-tag.python { background: #3776ab; color: white; }
        .skill-tag.rust { background: #ce422b; color: white; }
        .skill-tag.java { background: #ed8b00; color: white; }
        .skill-tag.go { background: #00add8; color: white; }
        .skill-tag.default { background: #e5e7eb; color: #374151; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }

        .animate-checkmark {
            animation: checkmark 0.5s ease forwards;
        }

        .animate-shake {
            animation: shake 0.5s ease forwards;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(65, 105, 225, 0.4);
        }

        .result-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .result-icon.success {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }

        .result-icon.fail {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
        }

        /* 小助手样式 */
        .assistant-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .assistant-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.5);
        }

        .assistant-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            background: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .assistant-panel {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 380px;
            height: 520px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 99;
        }

        .assistant-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            color: white;
        }

        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-ai {
            display: flex;
            align-items: flex-start;
        }

        .message-ai .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .message-user {
            justify-content: flex-end;
        }

        .message-user .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-ai .message-content {
            background: white;
            color: #374151;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-user {
            justify-content: flex-end;
        }

        .message-user .message-content {
            background: #10b981;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .assistant-input-area {
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
        }

        .assistant-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }

        .assistant-input:focus {
            border-color: #667eea;
        }

        .assistant-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .assistant-send-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .assistant-panel {
                width: calc(100% - 48px);
                right: 24px;
                left: 24px;
                height: 60vh;
            }
        }
    </style>
</head>

            <button class="assistant-send-btn" onclick="sendAssistantMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        // 小助手状态
        let assistantOpen = false;
        let unreadCount = 0;
        let messages = [];

        // 切换小助手面板
        function toggleAssistant() {
            assistantOpen = !assistantOpen;
            const panel = document.getElementById('assistantPanel');
            const toggle = document.getElementById('assistantToggle');
            
            if (assistantOpen) {
                panel.classList.remove('hidden');
                document.getElementById('assistantBadge').style.display = 'none';
                unreadCount = 0;
            } else {
                panel.classList.add('hidden');
            }
        }

        // 添加消息
        function addAssistantMessage(content, isUser = false) {
            const container = document.getElementById('assistantMessages');
            const messageDiv = document.createElement('div');
            
            if (isUser) {
                messageDiv.className = 'message message-user';
                messageDiv.innerHTML = `
                    <div class="message-content">${content}</div>
                    <div class="avatar">${localStorage.getItem('playerName')?.charAt(0) || '你'}</div>
                `;
            } else {
                messageDiv.className = 'message message-ai';
                messageDiv.innerHTML = `
                    <div class="avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">${content}</div>
                `;
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            messages.push({ content, isUser });
        }

        // 显示打字指示器
        function showTypingIndicator() {
            const container = document.getElementById('assistantMessages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message message-ai';
            typingDiv.innerHTML = `
                <div class="avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 隐藏打字指示器
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // 处理输入
        function handleAssistantInput(event) {
            if (event.key === 'Enter') {
                sendAssistantMessage();
            }
        }

        // 发送消息
        function sendAssistantMessage() {
            const input = document.getElementById('assistantInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addAssistantMessage(message, true);
            input.value = '';
            
            showTypingIndicator();
            
            setTimeout(() => {
                hideTypingIndicator();
                const response = processAssistantQuery(message);
                addAssistantMessage(response);
            }, 1000);
        }

        // 处理查询（预留接口）
        function processAssistantQuery(query) {
            const q = query.toLowerCase();
            
            if (q.includes('简历') || q.includes('自我介绍')) {
                return '简历中的自我介绍非常重要！建议从以下几个方面入手：<br><br>1. <strong>技术栈</strong>：列出你最擅长的编程语言和工具<br>2. <strong>项目经验</strong>：描述1-2个最有代表性的项目<br>3. <strong>个人优势</strong>：突出你的独特价值<br><br>记住，内容要真实具体，避免空泛的形容词！';
            }
            
            if (q.includes('薪资') || q.includes('工资')) {
                return '薪资谈判是求职中的重要环节。建议：<br><br>1. 先了解市场行情<br>2. 明确自己的底线<br>3. 展示自己的价值<br>4. 留有谈判空间<br><br>不要太急于谈薪资，先展示你的能力！';
            }
            
            if (q.includes('面试')) {
                return '面试准备很关键！建议：<br><br>1. 熟读JD，了解岗位职责<br>2. 准备STAR法则描述项目经历<br>3. 复习核心技术点<br>4. 准备一些反问面试官的问题<br><br>祝你面试顺利！';
            }
            
            if (q.includes('谢谢')) {
                return '不客气！有问题随时问我～ 😊';
            }
            
            return '我理解你的问题。作为求职小助手，我可以帮你解答关于简历、面试、薪资等方面的问题。你有什么具体想了解的吗？';
        }

        // 获取技能样式
        function getSkillClass(skillId) {
            if (skillId === 'progPython') return 'python';
            if (skillId === 'progRust') return 'rust';
            if (skillId === 'progJava') return 'java';
            if (skillId === 'progGo') return 'go';
            return 'default';
        }

        // 计算简历得分
        function calculateScore(resume, job) {
            let score = 0;
            const matchedSkills = [];
            const failedHardSkills = [];

            job.requirements.forEach(req => {
                if (req.type === 'hard') {
                    if (resume.skills.includes(req.condition)) {
                        score += Math.abs(req.score);
                    } else {
                        score += req.score;
                        failedHardSkills.push(req.desc);
                    }
                } else {
                    if (resume.skills.includes(req.condition)) {
                        score += req.score;
                        matchedSkills.push(req.desc);
                    }
                }
            });

            return { score, matchedSkills, failedHardSkills };
        }

        // 初始化小助手解读
        function initAssistantWithResult(passed, job, result) {
            addAssistantMessage('📋 让我来分析一下这次投递的结果...');
            
            setTimeout(() => {
                addAssistantMessage(`你投递的是 <strong>${job.company}</strong> 的 <strong>${job.title}</strong>。`);
            }, 800);
            
            setTimeout(() => {
                if (passed) {
                    addAssistantMessage('🎉 恭喜！你的简历成功通过了初筛！');
                } else {
                    addAssistantMessage('😢 很遗憾，你的简历未能通过这次筛选。');
                }
            }, 1600);
            
            setTimeout(() => {
                addAssistantMessage('💪 不要灰心！每一次投递都是经验。继续投递其他职位，或者回到角色创建页面调整你的技能分配。加油！');
            }, 2400);
        }

        // 初始化页面
        function initPage() {
            const resumeData = localStorage.getItem('currentResume');
            
            if (!resumeData) {
                window.location.href = 'index.html';
                return;
            }

            const resume = JSON.parse(resumeData);
            const job = jobsData.find(j => j.id === resume.jobId);

            if (!job) {
                window.location.href = 'index.html';
                return;
            }

            const result = calculateScore(resume, job);
            const passed = result.score >= job.passScore;

            // 设置头部
            const header = document.getElementById('resultHeader');
            if (passed) {
                header.innerHTML = `
                    <div class="result-icon success animate-checkmark">
                        <i class="fas fa-check text-white text-5xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white mb-2">恭喜通过初筛！</h1>
                    <p class="text-blue-100">您的简历已成功投递，等待面试通知...</p>
                `;
            } else {
                header.innerHTML = `
                    <div class="result-icon fail animate-shake">
                        <i class="fas fa-times text-white text-5xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white mb-2">未能通过初筛</h1>
                    <p class="text-blue-100">您的简历暂不符合该职位要求...</p>
                `;
            }

            // 设置内容
            const content = document.getElementById('resultContent');
            
            let matchedHTML = '';
            if (result.matchedSkills.length > 0) {
                matchedHTML = `
                    <div class="mb-4">
                        <h4 class="font-semibold text-green-700 mb-2 flex items-center">
                            <i class="fas fa-check-circle mr-2"></i>匹配项
                        </h4>
                        <div class="flex flex-wrap gap-2">
                            ${result.matchedSkills.map(s => `<span class="px-3 py-1 bg-green-100 text-green-700 text-sm rounded-full">${s}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            let failedHTML = '';
            if (result.failedHardSkills.length > 0) {
                failedHTML = `
                    <div class="mb-4">
                        <h4 class="font-semibold text-red-700 mb-2 flex items-center">
                            <i class="fas fa-exclamation-circle mr-2"></i>未满足的条件
                        </h4>
                        <div class="flex flex-wrap gap-2">
                            ${result.failedHardSkills.map(s => `<span class="px-3 py-1 bg-red-100 text-red-700 text-sm rounded-full">${s}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl p-6 mb-6">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <h2 class="text-xl font-bold text-secondary">${job.title}</h2>
                            <p class="text-gray-600 mt-1">
                                <i class="fas fa-building mr-1 text-gray-400"></i>${job.company}
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-bold ${passed ? 'text-green-600' : 'text-red-600'}">${result.score}分</p>
                            <p class="text-xs text-gray-500">得分 / 及格线: ${job.passScore}分</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    ${passed ? matchedHTML : (failedHTML + matchedHTML)}
                </div>

                <div class="mt-6 pt-6 border-t border-gray-200">
                    <h4 class="font-semibold text-gray-800 mb-3 flex items-center">
                        <i class="fas fa-file-alt mr-2 text-blue-500"></i>您的简历信息
                    </h4>
                    <div class="bg-gray-50 rounded-xl p-4">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-sm text-gray-500">姓名</p>
                                <p class="font-medium">${resume.name}</p>

                            <div>

                            <div class="col-span-2">
                                <p class="text-sm text-gray-500">联系方式</p>
                                <p class="font-medium">${resume.email}</p>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <p class="text-sm text-gray-500 mb-2">已选技能</p>
                            <div class="flex flex-wrap gap-2">
                                ${resume.skills.map(skill => {
                                    const skillName = getSkillName(skill);
                                    const skillClass = getSkillClass(skill);
                                    return '<span class="skill-tag ' + skillClass + '">' + skillName + '</span>';
                                }).join('')}

                        <div>

            initAssistantWithResult(passed, job, result);
