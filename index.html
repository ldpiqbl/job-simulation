<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>破壁纪元 - 职场沙盘生存指南</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4169E1',
                        secondary: '#2C3E50',
                        accent: '#E74C3C',
                        background: '#F5F7FA',
                        card: '#FFFFFF',
                        border: '#E8E8E8'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {
            font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
            --shadow-lg: 0 8px 25px rgba(0,0,0,0.12);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .animate-slide-in {
            animation: slideInRight 0.3s ease forwards;
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.3s ease forwards;
        }

        .animate-slide-out {
            animation: slideOutRight 0.3s ease forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        .animate-bounce-in {
            animation: bounceIn 0.5s ease forwards;
        }

        .job-card:nth-child(1) { animation-delay: 0ms; }
        .job-card:nth-child(2) { animation-delay: 100ms; }
        .job-card:nth-child(3) { animation-delay: 200ms; }
        .job-card:nth-child(4) { animation-delay: 300ms; }
        .job-card:nth-child(5) { animation-delay: 400ms; }
        .job-card:nth-child(6) { animation-delay: 500ms; }
        .job-card:nth-child(7) { animation-delay: 600ms; }
        .job-card:nth-child(8) { animation-delay: 700ms; }
        .job-card:nth-child(9) { animation-delay: 800ms; }

        .salary-text {
            font-family: 'DIN Alternate', 'Roboto', sans-serif;
            font-weight: 700;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .panel-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .panel-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .panel-scroll::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .panel-scroll::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #4169E1;
            transition: width 0.2s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .badge {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-apply {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
            transition: all 0.3s ease;
        }

        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(65, 105, 225, 0.4);
        }

        /* 小助手样式 */
        .assistant-panel {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 360px;
            height: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .assistant-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .assistant-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .assistant-info {
            flex: 1;
            margin-left: 12px;
            color: white;
        }

        .assistant-name {
            font-weight: 600;
            font-size: 15px;
        }

        .assistant-status {
            font-size: 12px;
            opacity: 0.9;
        }

        .assistant-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .assistant-close:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .assistant-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 12px;
            animation: fadeInUp 0.3s ease;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-ai {
            display: flex;
            align-items: flex-start;
        }

        .message-ai .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-right: 10px;
        }

        .message-ai .message-content {
            background: white;
            border: 1px solid #e5e7eb;
            border-top-left-radius: 4px;
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-user .message-content {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
            color: white;
            border-top-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .assistant-input {
            padding: 12px 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
        }

        .assistant-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .assistant-input input:focus {
            border-color: #667eea;
        }

        .assistant-input button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .assistant-input button:hover {
            transform: scale(1.1);
        }

        .assistant-mini {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            z-index: 1000;
        }

        .assistant-mini:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.5);
        }

        .assistant-mini .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .hidden-panel {
            display: none;
        }

        .visible-panel {
            display: flex;
        }

        .jd-section {
            border-left: 3px solid #e5e7eb;
            padding-left: 16px;
            margin: 16px 0;
        }

        .jd-section-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jd-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .jd-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 6px;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
        }

        .jd-list li::before {
            content: '•';
            position: absolute;
            left: 6px;
            color: #9ca3af;
        }

        .company-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .company-badge.micro { background: #fef3c7; color: #92400e; }
        .company-badge.sme { background: #dbeafe; color: #1e40af; }
        .company-badge.unicorn { background: #fce7f3; color: #9d174d; }
        .company-badge.big { background: #fee2e2; color: #991b1b; }
        .company-badge.foreign { background: #e0e7ff; color: #3730a3; }
        .company-badge.chaos { background: #fef9c3; color: #854d0e; }
        .company-badge.screw { background: #f3f4f6; color: #374151; }
        .company-badge.pie { background: #fdf2f8; color: #9d174d; }
        .company-badge.throw { background: #fff7ed; color: #9a3412; }
        .company-badge.pension { background: #ecfdf5; color: #047857; }
    </style>
</head>
<body class="bg-background min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='character-creation.html'">
                    <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
                        <i class="fas fa-gamepad text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-secondary">破壁纪元</h1>
                        <p class="text-xs text-gray-500 -mt-1">职场沙盘生存指南</p>
                    </div>
                </div>

                <nav class="hidden md:flex items-center space-x-8">
                    <a href="#" class="nav-link text-gray-700 font-medium hover:text-primary">找职位</a>
                    <a href="#" class="nav-link text-gray-700 font-medium hover:text-primary">游戏攻略</a>
                    <a href="#" class="nav-link text-gray-700 font-medium hover:text-primary">社区</a>
                </nav>

                <div class="flex items-center space-x-4">
                    <button id="myBtn" class="flex items-center space-x-2 px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <div class="user-avatar text-sm">
                            <i class="fas fa-user"></i>
                        </div>
                        <span id="playerNameDisplay" class="text-sm font-medium text-gray-700">游客</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 用户信息面板 -->
        <div id="userPanel" class="fixed inset-0 z-50 hidden">
            <div class="user-overlay absolute inset-0 bg-black/50 backdrop-blur-sm" id="userOverlay"></div>
            <div class="absolute right-0 top-0 h-full w-80 bg-white shadow-2xl animate-slide-in overflow-hidden">
                <div class="gradient-bg p-6 text-white">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold">角色信息</h2>
                        <button id="closeUserPanel" class="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition-colors">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="flex items-center">
                        <div class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold mr-4">
                            <span id="panelAvatarInitial">?</span>
                        </div>
                        <div>
                            <p id="panelPlayerName" class="font-bold text-lg">玩家</p>
                            <p id="panelPlayerJob" class="text-sm opacity-90">Agent工程师</p>
                        </div>
                    </div>
                </div>
                
                <div class="p-6 panel-scroll" style="max-height: calc(100% - 180px); overflow-y: auto;">
                    <div class="space-y-4">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">性别</span>
                            <span id="panelGender" class="font-medium">男</span>
                        </div>
                        
                        <div class="border-t border-gray-100 pt-4">
                            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                                <i class="fas fa-star mr-2 text-yellow-500"></i>已选技能
                            </h3>
                            <div id="panelSkills" class="flex flex-wrap gap-2">
                                <!-- 技能标签将通过JS动态添加 -->
                            </div>
                        </div>
                        
                        <div class="border-t border-gray-100 pt-4">
                            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                                <i class="fas fa-chart-pie mr-2 text-blue-500"></i>属性概览
                            </h3>
                            <div class="space-y-3">
                                <div>
                                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                                        <span>技术能力</span>
                                        <span id="techCount">0/3</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div id="techBar" class="h-full bg-green-500 rounded-full transition-all" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                                        <span>项目经历</span>
                                        <span id="projectCount">0/2</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div id="projectBar" class="h-full bg-yellow-500 rounded-full transition-all" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                                        <span>加分项</span>
                                        <span id="bonusCount">0/1</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div id="bonusBar" class="h-full bg-orange-500 rounded-full transition-all" style="width: 0%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-6 pt-4 border-t border-gray-100">
                        <button onclick="localStorage.clear(); window.location.reload();" class="w-full px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors text-sm font-medium">
                            <i class="fas fa-sign-out-alt mr-2"></i>重新创建角色
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 职位列表标题 -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-secondary">
                <i class="fas fa-robot mr-2 text-purple-500"></i>Agent工程师职位
            </h2>
        </div>
        
        <!-- 职位列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="jobList"></div>
    </main>

    <!-- 遮罩层 -->
    <div class="overlay fixed inset-0 z-40 hidden" id="detailOverlay"></div>

    <!-- 职位详情面板 -->
    <div id="jobDetailPanel" class="fixed left-0 top-0 h-full w-[600px] bg-white shadow-[-4px_0_20px_rgba(0,0,0,0.15)] animate-slide-in-left overflow-hidden flex flex-col z-50 hidden">
        <div class="sticky top-0 bg-white border-b border-gray-100 p-6 flex items-center justify-between z-10">
            <h2 class="text-xl font-bold text-secondary">职位详情</h2>
            <button onclick="closeJobDetail()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center transition-colors">
                <i class="fas fa-times text-gray-500"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto panel-scroll" id="detailContent">
            <!-- 动态内容 -->
        </div>
        
        <div class="sticky bottom-0 bg-white border-t border-gray-100 p-6">
            <button id="applyBtn" onclick="applyForJob()" class="w-full btn-apply text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all">
                <i class="fas fa-paper-plane mr-2"></i>投递简历
            </button>
        </div>
    </div>

    <!-- 小助手面板 -->
    <div id="assistantPanel" class="assistant-panel hidden-panel">
        <div class="assistant-header">
            <div class="flex items-center">
                <div class="assistant-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="assistant-info">
                    <div class="assistant-name">求职小助手</div>
                    <div class="assistant-status">在线 · 随时为你解答</div>
                </div>
            </div>
            <div class="assistant-close" onclick="toggleAssistant()">
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
        
        <div class="assistant-messages" id="assistantMessages">
            <!-- 消息内容 -->
        </div>
        
        <div class="assistant-input">
            <input type="text" id="assistantInput" placeholder="输入问题..." onkeypress="handleAssistantInput(event)">
            <button onclick="sendAssistantMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- 小助手悬浮按钮 -->
    <div id="assistantMini" class="assistant-mini" onclick="toggleAssistant()">
        <i class="fas fa-comment-dots"></i>
        <div class="notification-badge" id="notificationBadge" style="display: none;">1</div>
    </div>

    <script>
        // 职位数据 - 完全按照JD简历筛选映射系统.md
        const jobsData = [
            {
                id: 'job-micro-1',
                company: '光年AI工作室',
                companyType: '微型企业',
                companyTypeClass: 'micro',
                title: 'AI应用开发工程师',
                salary: { min: 8, max: 15 },
                location: '远程办公',
                tags: ['Python', 'LLM', '全栈'],
                isHot: false,
                jd: {
                    intro: '我们是一家3人AI工作室，正在做一款AI效率工具，需要一位能独当一面的伙伴加入。',
                    responsibilities: [
                        '会Python，能写能跑',
                        '了解LLM，用过ChatGPT/API就行',
                        '能独立把一个想法变成产品',
                        '有自己做过的小项目最好'
                    ],
                    benefits: [
                        '扁平管理，直接和创始人干',
                        '灵活办公，不打卡',
                        '早期员工股权'
                    ]
                },
                passScore: 20,
                requirements: [
                    { field: 'skill', type: 'hard', condition: 'progPython', score: -15, desc: 'Python技能' },
                    { field: 'project', type: 'hard', condition: 'projOpenSource', score: -10, desc: '个人项目经历' },
                    { field: 'skill', type: 'soft', condition: 'llmPrompt', score: 5, desc: 'Prompt Engineering' },
                    { field: 'skill', type: 'soft', condition: 'llmRAG', score: 8, desc: 'RAG技术' },

                jdHTML += `

                        <div class="jd-section-title">
                            <i class="fas fa-tasks text-blue-500"></i>
                            岗位职责

                        <ul class="jd-list">

            if (job.jd.requirements && job.jd.requirements.length > 0) {
                jdHTML += `

            overlay.classList.remove('hidden');

            triggerAssistantForJob(job);

        // 关闭职位详情
        function closeJobDetail() {
            const panel = document.getElementById('jobDetailPanel');
            const overlay = document.getElementById('detailOverlay');
            panel.classList.add('hidden');
            overlay.classList.add('hidden');
            currentJobId = null;
        }

        // 投递简历
        function applyForJob() {
            if (!currentJobId) {
                alert('请先选择一个职位');
                return;
            }
            
            // 跳转到写简历页面
            window.location.href = 'apply.html?jobId=' + currentJobId;
        }

        // 打开用户面板
        function openUserPanel() {
            document.getElementById('userPanel').classList.remove('hidden');

        function closeUserPanel() {

        // 更新用户面板
        function updateUserPanel() {
            const playerName = localStorage.getItem('playerName') || '游客';
            const playerGender = localStorage.getItem('playerGender') || '男';
            const playerJob = localStorage.getItem('playerJobName') || 'Agent工程师';
            const playerSkills = JSON.parse(localStorage.getItem('playerSkills') || '[]');

            document.getElementById('playerNameDisplay').textContent = playerName;
            document.getElementById('panelPlayerName').textContent = playerName;
            document.getElementById('panelPlayerJob').textContent = playerJob;
            document.getElementById('panelGender').textContent = playerGender;
            document.getElementById('panelAvatarInitial').textContent = playerName.charAt(0).toUpperCase();

            // 技能标签
            const skillsContainer = document.getElementById('panelSkills');
            if (playerSkills.length > 0) {
                skillsContainer.innerHTML = playerSkills.map(skill => {
                    return `<span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded-full">${getSkillName(skill)}</span>`;
                }).join('');
            } else {
                skillsContainer.innerHTML = '<p class="text-gray-400 text-sm">暂无技能</p>';
            }

            // 技能统计
            const techSkills = ['progPython', 'progGo', 'progJava', 'progRust', 'aimlML', 'aimlDL', 'aimlNLP', 'llmPrompt', 'llmRAG', 'llmFineTune', 'agentFramework', 'agentCore', 'agentMulti', 'engContainer', 'engDistributed', 'engAPI'];
            const projectSkills = ['projBasic', 'projOpenSource', 'projBlog', 'projIntern', 'projBigCompany', 'projCoreProject', 'projPR', 'projCompetition', 'projPaper'];
            const bonusSkills = ['bonusEnglish', 'bonusInfluence', 'bonusHonor', 'bonusStartup', 'bonusOverseas'];

            const techCount = playerSkills.filter(s => techSkills.includes(s)).length;
            const projectCount = playerSkills.filter(s => projectSkills.includes(s)).length;
            const bonusCount = playerSkills.filter(s => bonusSkills.includes(s)).length;

            document.getElementById('techCount').textContent = `${techCount}/${techSkills.length}`;
            document.getElementById('techBar').style.width = `${(techCount / techSkills.length) * 100}%`;

            document.getElementById('projectCount').textContent = `${projectCount}/${projectSkills.length}`;
            document.getElementById('projectBar').style.width = `${(projectCount / projectSkills.length) * 100}%`;

            document.getElementById('bonusCount').textContent = `${bonusCount}/${bonusSkills.length}`;
            document.getElementById('bonusBar').style.width = `${(bonusCount / bonusSkills.length) * 100}%`;
        }

        // 小助手功能
        let assistantOpen = false;
        let currentJobId = null;
        let unreadCount = 0;

        function toggleAssistant() {
            const panel = document.getElementById('assistantPanel');
            const mini = document.getElementById('assistantMini');
            
            assistantOpen = !assistantOpen;
            
            if (assistantOpen) {
                panel.classList.remove('hidden-panel');
                panel.classList.add('visible-panel');
                mini.style.display = 'none';
                document.getElementById('notificationBadge').style.display = 'none';
                unreadCount = 0;
            } else {
                panel.classList.add('hidden-panel');
                panel.classList.remove('visible-panel');
                mini.style.display = 'flex';
            }
        }

        function addAssistantMessage(content, isUser = false) {
            const container = document.getElementById('assistantMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'message-user' : 'message-ai'}`;
            
            messageDiv.innerHTML = `
                ${isUser ? '' : `
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                `}
                <div class="message-content">
                    ${content}
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showTypingIndicator() {
            const container = document.getElementById('assistantMessages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message message-ai';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 触发小助手解读职位
        function triggerAssistantForJob(job) {
            if (!assistantOpen) {
                unreadCount++;
                document.getElementById('notificationBadge').textContent = unreadCount;
                document.getElementById('notificationBadge').style.display = 'flex';
            }

            showTypingIndicator();
            
            setTimeout(() => {
                hideTypingIndicator();
                
                const tips = [
                    '欢迎查看' + job.company + '的职位！让我来帮你分析一下这个JD。',
                    '这个职位看起来很有挑战性，我来帮你看看需要什么技能。'
                ];
                
                addAssistantMessage(tips[Math.floor(Math.random() * tips.length)]);
                
                setTimeout(() => {
                    addAssistantMessage(job.title + ' - ' + job.company);
                }, 1000);
                
                setTimeout(() => {
                    addAssistantMessage('投递前建议对照JD要求，看看自己的<strong>技能匹配度</strong>如何。');
                }, 2000);
            }, 1500);
        }

        // 处理小助手输入
        function handleAssistantInput(event) {
            if (event.key === 'Enter') {
                sendAssistantMessage();
            }
        }

        function sendAssistantMessage() {
            const input = document.getElementById('assistantInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addAssistantMessage(message, true);
            input.value = '';
            
            // 接口预留：这里可以接入AI对话模型
            // 目前只是简单的模拟回复
            showTypingIndicator();
            
            setTimeout(() => {
                hideTypingIndicator();
                
                // 模拟AI回复 - 这里预留接口
                const aiResponse = processAssistantQuery(message);
                addAssistantMessage(aiResponse);
            }, 1500);
        }

        // 预留的AI对话接口
        function processAssistantQuery(query) {
            // TODO: 接入真实的AI对话模型
            // const response = await callAI API(query);
            // return response;
            
            // 简单的关键词匹配回复
            const lowerQuery = query.toLowerCase();
            
            if (lowerQuery.includes('jd') || lowerQuery.includes('职位') || lowerQuery.includes('岗位')) {
                return '你可以点击任意职位卡片查看详情。如果想了解某个职位的具体要求，可以直接问我哦！';
            }
            
            if (lowerQuery.includes('筛选') || lowerQuery.includes('评分')) {
                return '简历筛选主要看你的技能匹配度。硬性条件不满足会扣分，软性条件满足会加分。达到及格线就能通过初筛！';
            }
            
            if (lowerQuery.includes('技能') || lowerQuery.includes('属性')) {
                const skills = JSON.parse(localStorage.getItem('playerSkills') || '[]');
                if (skills.length === 0) {
                    return '你还没有选择任何技能哦。建议在角色创建时仔细分配属性点，不同职位看重不同的技能组合。';
                }
                return `你当前的技能包括：${skills.map(s => getSkillName(s)).join('、')}。想了解如何针对特定职位优化简历吗？`;
            }
            
            if (lowerQuery.includes('帮助')) {
                return '我是你的求职小助手！可以帮你：\n1. 解读JD中的隐藏含义\n2. 分析你的简历与职位的匹配度\n3. 提供求职建议\n\n有什么想问的尽管说！';
            }
            
            return '这个问题我还在学习中。你可以问我关于职位分析、简历筛选、求职建议等方面的问题！';
        }

        // 初始化小助手
        function initAssistant() {
            const container = document.getElementById('assistantMessages');
            container.innerHTML = '';
            
            setTimeout(() => {
                addAssistantMessage('欢迎来到破壁纪元！');
            }, 500);
            
            setTimeout(() => {
                addAssistantMessage('我是你的求职小助手，可以帮你：<br>• 解读职位JD中的隐藏信息<br>• 分析简历与职位的匹配度<br>• 提供求职策略建议');
            }, 1200);
            
            setTimeout(() => {
                addAssistantMessage('点击右上角的职位卡片，开始你的求职之旅吧！有任何问题随时问我~');
            }, 2400);
        }

        // 检查角色是否已创建
        function checkCharacter() {
            const playerName = localStorage.getItem('playerName');
            if (!playerName) {
                window.location.href = 'character-creation.html';
                return false;
            }
            return true;
        }

        // 事件监听
        document.getElementById('myBtn').addEventListener('click', openUserPanel);
        document.getElementById('closeUserPanel').addEventListener('click', closeUserPanel);
        document.getElementById('userOverlay').addEventListener('click', closeUserPanel);
        document.getElementById('detailOverlay').addEventListener('click', closeJobDetail);

        // ESC键关闭面板
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeJobDetail();
                closeUserPanel();
            }
        });

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkCharacter()) {
                return;
            }
            renderJobCards();
            updateUserPanel();
            initAssistant();
        });
    </script>
