<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投递简历 - 破壁纪元</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4169E1',
                        secondary: '#2C3E50',
                        accent: '#E74C3C',
                        background: '#F5F7FA',
                        card: '#FFFFFF',
                        border: '#E8E8E8'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {
            font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
        }

        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.2);
            border-color: #4169E1;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        .skill-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin: 4px;
        }

        .skill-tag.python { background: #3776ab; color: white; }
        .skill-tag.rust { background: #ce422b; color: white; }
        .skill-tag.java { background: #ed8b00; color: white; }
        .skill-tag.go { background: #00add8; color: white; }
        .skill-tag.default { background: #e5e7eb; color: #374151; }

        .company-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .company-badge.micro { background: #fef3c7; color: #92400e; }
        .company-badge.sme { background: #dbeafe; color: #1e40af; }
        .company-badge.unicorn { background: #fce7f3; color: #9d174d; }
        .company-badge.big { background: #fee2e2; color: #991b1b; }
        .company-badge.foreign { background: #e0e7ff; color: #3730a3; }
        .company-badge.chaos { background: #fef9c3; color: #854d0e; }
        .company-badge.screw { background: #f3f4f6; color: #374151; }
        .company-badge.pie { background: #fdf2f8; color: #9d174d; }
        .company-badge.throw { background: #fff7ed; color: #9a3412; }
        .company-badge.pension { background: #ecfdf5; color: #047857; }

        .jd-section {
            margin-bottom: 1.5rem;
        }

        .jd-section-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .jd-list {
            list-style: none;
            padding-left: 0;
        }

        .jd-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
            color: #4b5563;
            line-height: 1.6;
        }

        .jd-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #6366f1;
            font-weight: bold;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4169E1 0%, #6B8DD6 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(65, 105, 225, 0.4);
        }

        .sidebar-sticky {
            position: sticky;
            top: 2rem;
        }

        .ability-bar {
            height: 8px;
            border-radius: 4px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .ability-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* 小助手样式 */
        .assistant-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .assistant-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.5);
        }

        .assistant-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            background: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .assistant-panel {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 380px;
            height: 520px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 99;
        }

        .assistant-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            color: white;
        }

        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-ai {
            display: flex;
            align-items: flex-start;
        }

        .message-ai .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .message-user .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-ai .message-content {
            background: white;
            color: #374151;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-user {
            justify-content: flex-end;
        }

        .message-user .message-content {
            background: #10b981;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .assistant-input-area {
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
        }

        .assistant-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }

        .assistant-input:focus {
            border-color: #667eea;
        }

        .assistant-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .assistant-send-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .assistant-panel {
                width: calc(100% - 48px);
                right: 24px;
                left: 24px;
                height: 60vh;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左侧主要内容 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">
                    <div class="gradient-bg p-6 text-center">
                        <h1 class="text-2xl font-bold text-white mb-1">
                            <i class="fas fa-file-alt mr-2"></i>编写简历
                        </h1>
                        <p class="text-blue-100 text-sm">完善您的求职简历，准备投递目标职位</p>
                    </div>

                    <div class="p-6" id="jobInfo">
                        <!-- 完整JD信息 -->
                    </div>

                    <div class="p-6 border-t border-gray-100">
                        <form id="resumeForm" onsubmit="submitResume(event)">
                            <div class="space-y-6">
                                <!-- 基本信息 -->
                                <div>
                                    <h3 class="text-lg font-bold text-secondary mb-4 flex items-center">
                                        <i class="fas fa-user mr-2 text-primary"></i>基本信息

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">

                                                class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-gray-50"
                                                readonly>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                                <i class="fas fa-venus-mars mr-1 text-gray-400"></i>性别
                                            </label>
                                            <input type="text" id="playerGender" 
                                                class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-gray-50"
                                                readonly>
                                        </div>
                                        <div class="md:col-span-2">
                                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                                <i class="fas fa-envelope mr-1 text-gray-400"></i>联系方式
                                            </label>
                                            <input type="email" value="player@mail.com"

                                        </div>
                                    </div>
                                </div>

                                <!-- 自我介绍 -->
                                <div>
                                    <h3 class="text-lg font-bold text-secondary mb-4 flex items-center">
                                        <i class="fas fa-pen mr-2 text-purple-500"></i>自我介绍
                                    </h3>
                                    <div>
                                        <textarea id="selfIntro"

                                            placeholder="请详细介绍您的技术栈、项目经验、工作经历等，让招聘方更了解您的实力..."></textarea>
                                        <p class="text-xs text-gray-400 mt-2">* 这是展现您个人特色的机会，建议详细描述</p>
                                    </div>

                                <!-- 提交按钮 -->
                                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                                    <button type="button" onclick="goBack()" 
                                        class="px-6 py-3 text-gray-600 hover:text-gray-800 font-medium transition-colors">
                                        <i class="fas fa-arrow-left mr-2"></i>返回职位列表
                                    </button>
                                    <button type="submit" 
                                        class="btn-primary text-white font-bold py-3 px-8 rounded-xl shadow-lg">
                                        <i class="fas fa-paper-plane mr-2"></i>投递简历
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 右侧角色信息 -->
            <div class="lg:col-span-1">
                <div class="sidebar-sticky">
                    <div class="bg-white rounded-2xl shadow-xl p-6 animate-fade-in-up">
                        <div class="text-center mb-6">
                            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4" id="sidebarAvatar">
                                ?
                            </div>
                            <h3 class="text-xl font-bold text-gray-800" id="sidebarName">玩家</h3>
                            <p class="text-gray-500 text-sm" id="sidebarJob">Agent工程师</p>

                        <!-- 属性概览 -->

                                <i class="fas fa-chart-pie mr-2 text-primary"></i>属性概览
                            </h4>
                            <div class="space-y-3">
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="text-gray-600">技术能力</span>
                                        <span id="techCount" class="text-gray-800 font-medium">0/16</span>
                                    </div>
                                    <div class="ability-bar">
                                        <div id="techBar" class="ability-fill bg-green-500" style="width: 0%"></div>
                                    </div>

                                <div>
                                    <div class="flex justify-between text-sm mb-1">

                                        <span id="projectCount" class="text-gray-800 font-medium">0/9</span>

                                    <div class="ability-bar">
                                        <div id="projectBar" class="ability-fill bg-yellow-500" style="width: 0%"></div>

                                    </div>

                                        <div id="bonusBar" class="ability-fill bg-orange-500" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="text-gray-600">学历</span>
                                        <span id="eduLevel" class="text-gray-800 font-medium">未选择</span>

                                </div>
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="text-gray-600">心理特质</span>
                                        <span id="psyLevel" class="text-gray-800 font-medium">未选择</span>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="text-gray-600">身体特质</span>
                                        <span id="phyLevel" class="text-gray-800 font-medium">未选择</span>
                                    </div>

                        </div>

                        <!-- 技能标签 -->
                        <div class="mb-6">
                            <h4 class="font-semibold text-gray-800 mb-4 flex items-center">
                                <i class="fas fa-code mr-2 text-green-500"></i>已获得技能
                            </h4>
                            <div id="sidebarSkills" class="flex flex-wrap gap-2">
                                <p class="text-gray-400 text-sm italic">暂无技能</p>
                            </div>

                        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                            <h4 class="font-semibold text-blue-800 mb-3 flex items-center">
                                <i class="fas fa-bullseye mr-2"></i>当前目标

    </div>

    <!-- 小助手悬浮按钮 -->
    <div class="assistant-toggle" id="assistantToggle" onclick="toggleAssistant()">
        <i class="fas fa-comments text-xl"></i>
        <div class="assistant-badge" id="assistantBadge" style="display: none;">0</div>
    </div>

    <!-- 小助手面板 -->
    <div class="assistant-panel hidden" id="assistantPanel">
        <div class="assistant-header">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mr-3">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-bold">求职小助手</h3>
                        <p class="text-xs text-white/70">随时为您解答</p>
                    </div>
                </div>
                <button onclick="toggleAssistant()" class="text-white/70 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <div class="assistant-messages" id="assistantMessages">
            <!-- 消息会在这里动态添加 -->
        </div>
        
        <div class="assistant-input-area">
            <input type="text" class="assistant-input" id="assistantInput" placeholder="输入您的问题..." onkeypress="handleAssistantInput(event)">
            <button class="assistant-send-btn" onclick="sendAssistantMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // 获取URL参数
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 小助手状态
        let assistantOpen = false;
        let unreadCount = 0;
        let messages = [];

        // 小助手机器人名称
        const assistantName = '求职小助手';

        // 切换小助手面板
        function toggleAssistant() {
            assistantOpen = !assistantOpen;
            const panel = document.getElementById('assistantPanel');
            const toggle = document.getElementById('assistantToggle');
            
            if (assistantOpen) {
                panel.classList.remove('hidden');
                toggle.querySelector('.fa-comments').classList.remove('fa-comments');
                toggle.querySelector('.fa-times');
                document.getElementById('assistantBadge').style.display = 'none';
                unreadCount = 0;
            } else {
                panel.classList.add('hidden');
            }
        }

        // 添加消息
        function addAssistantMessage(content, isUser = false) {
            const container = document.getElementById('assistantMessages');
            const messageDiv = document.createElement('div');
            
            if (isUser) {
                messageDiv.className = 'message message-user';
                messageDiv.innerHTML = `
                    <div class="message-content">${content}</div>
                    <div class="avatar">${localStorage.getItem('playerName')?.charAt(0) || '你'}</div>
                `;
            } else {
                messageDiv.className = 'message message-ai';
                messageDiv.innerHTML = `
                    <div class="avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">${content}</div>
                `;
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            messages.push({ content, isUser });
        }

        // 显示打字指示器
        function showTypingIndicator() {
            const container = document.getElementById('assistantMessages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message message-ai';
            typingDiv.innerHTML = `
                <div class="avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 隐藏打字指示器
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // 处理输入
        function handleAssistantInput(event) {
            if (event.key === 'Enter') {
                sendAssistantMessage();
            }
        }

        // 发送消息
        function sendAssistantMessage() {
            const input = document.getElementById('assistantInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addAssistantMessage(message, true);
            input.value = '';
            
            showTypingIndicator();
            
            setTimeout(() => {
                hideTypingIndicator();
                const response = processAssistantQuery(message);
                addAssistantMessage(response);
            }, 1000);
        }

        // 处理查询（预留接口）
        function processAssistantQuery(query) {
            // TODO: 接入真实的AI对话模型
            // const response = await callAI API(query);
            // return response;
            
            // 临时使用关键词匹配回复
            const q = query.toLowerCase();
            
            if (q.includes('简历') || q.includes('自我介绍')) {
                return '简历中的自我介绍非常重要！建议从以下几个方面入手：<br><br>1. <strong>技术栈</strong>：列出你最擅长的编程语言和工具<br>2. <strong>项目经验</strong>：描述1-2个最有代表性的项目<br>3. <strong>个人优势</strong>：突出你的独特价值<br><br>记住，内容要真实具体，避免空泛的形容词！';
            }

                'projBigCompany': '大厂实习',
                'projCoreProject': '大厂核心项目',
                'projPR': '开源贡献',
                'projCompetition': '专业比赛获奖',
                'projPaper': '顶会论文',
                'bonusEnglish': '英语能力',
                'bonusInfluence': '技术影响力',
                'bonusHonor': '竞赛荣誉',
                'bonusStartup': '创业经历',
                'bonusOverseas': '海外经历',
                'edu专科': '专科',
                'edu普通本科': '普通本科',
                'edu211': '211本科',
                'edu985': '985本科',
                'edu硕士': '硕士',
                'psy玻璃心': '玻璃心',
                'psy普通人': '普通人',
                'psy压力爱好者': '压力爱好者',
                'phy电量不足': '电量不足',
                'phy普通人': '普通人',
                'phy牛马体质': '牛马体质'
            };
            return skillNames[skillId] || skillId;
        }

        // 获取技能样式
        function getSkillClass(skillId) {
            if (skillId === 'progPython') return 'python';
            if (skillId === 'progRust') return 'rust';
            if (skillId === 'progJava') return 'java';
            if (skillId === 'progGo') return 'go';
            return 'default';
        }

        // 生成JD HTML
        function generateJobDetailHTML(job) {
            let jdHTML = '';

            if (job.jd.summary) {
                jdHTML += `
                    <div class="jd-section">
                        <div class="jd-section-title">
                            <i class="fas fa-info-circle text-blue-500"></i>
                            职位描述
                        </div>
                        <p class="text-gray-600 leading-relaxed">${job.jd.summary}</p>
                    </div>
                `;
            }

            if (job.jd.responsibilities && job.jd.responsibilities.length > 0) {
                jdHTML += `
                    <div class="jd-section">
                        <div class="jd-section-title">
                            <i class="fas fa-tasks text-indigo-500"></i>
                            岗位职责
                        </div>
                        <ul class="jd-list">
                            ${job.jd.responsibilities.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (job.jd.requirements && job.jd.requirements.length > 0) {
                jdHTML += `
                    <div class="jd-section">
                        <div class="jd-section-title">
                            <i class="fas fa-user-check text-green-500"></i>
                            任职要求
                        </div>
                        <ul class="jd-list">
                            ${job.jd.requirements.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (job.jd.bonus && job.jd.bonus.length > 0) {
                jdHTML += `
                    <div class="jd-section">
                        <div class="jd-section-title">
                            <i class="fas fa-star text-yellow-500"></i>
                            加分项
                        </div>
                        <ul class="jd-list">
                            ${job.jd.bonus.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (job.jd.benefits && job.jd.benefits.length > 0) {
                jdHTML += `
                    <div class="jd-section">
                        <div class="jd-section-title">
                            <i class="fas fa-gift text-purple-500"></i>
                            我们提供
                        </div>
                        <ul class="jd-list">
                            ${job.jd.benefits.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            return jdHTML;
        }

        // 更新侧边栏信息
        function updateSidebar(playerSkills, job) {
            // 更新头像
            const playerName = localStorage.getItem('playerName') || '玩家';
            document.getElementById('sidebarAvatar').textContent = playerName.charAt(0).toUpperCase();
            document.getElementById('sidebarName').textContent = playerName;
            document.getElementById('sidebarJob').textContent = localStorage.getItem('playerJobName') || 'Agent工程师';

            // 技能分类统计
            const techSkills = ['progPython', 'progGo', 'progJava', 'progRust', 'aimlML', 'aimlDL', 'aimlNLP', 'llmPrompt', 'llmRAG', 'llmFineTune', 'agentFramework', 'agentCore', 'agentMulti', 'engContainer', 'engDistributed', 'engAPI'];
            const projectSkills = ['projBasic', 'projOpenSource', 'projBlog', 'projIntern', 'projBigCompany', 'projCoreProject', 'projPR', 'projCompetition', 'projPaper'];
            const bonusSkills = ['bonusEnglish', 'bonusInfluence', 'bonusHonor', 'bonusStartup', 'bonusOverseas'];

            const techCount = playerSkills.filter(s => techSkills.includes(s)).length;
            const projectCount = playerSkills.filter(s => projectSkills.includes(s)).length;
            const bonusCount = playerSkills.filter(s => bonusSkills.includes(s)).length;

            document.getElementById('techCount').textContent = techCount + '/16';
            document.getElementById('techBar').style.width = (techCount / 16 * 100) + '%';

            document.getElementById('projectCount').textContent = projectCount + '/9';
            document.getElementById('projectBar').style.width = (projectCount / 9 * 100) + '%';

            document.getElementById('bonusCount').textContent = bonusCount + '/5';
            document.getElementById('bonusBar').style.width = (bonusCount / 5 * 100) + '%';

            // 更新其他属性
            const eduOption = playerSkills.find(s => s.startsWith('edu'));
            document.getElementById('eduLevel').textContent = eduOption ? getSkillName(eduOption) : '未选择';

            const psyOption = playerSkills.find(s => s.startsWith('psy'));
            document.getElementById('psyLevel').textContent = psyOption ? getSkillName(psyOption) : '未选择';

            const phyOption = playerSkills.find(s => s.startsWith('phy'));
            document.getElementById('phyLevel').textContent = phyOption ? getSkillName(phyOption) : '未选择';

            // 更新技能标签
            const skillsContainer = document.getElementById('sidebarSkills');
            if (playerSkills.length > 0) {
                skillsContainer.innerHTML = playerSkills.map(skill => {
                    const skillName = getSkillName(skill);
                    const skillClass = getSkillClass(skill);
                    return '<span class="skill-tag ' + skillClass + '">' + skillName + '</span>';
                }).join('');
            } else {
                skillsContainer.innerHTML = '<p class="text-gray-400 text-sm italic">暂无技能</p>';
            }

            // 更新目标职位信息
            const targetInfo = document.getElementById('targetJobInfo');
            if (job) {
                targetInfo.innerHTML = `
                    <div class="text-sm">
                        <p class="font-semibold text-blue-800">${job.title}</p>
                        <p class="text-gray-600">${job.company}</p>
                        <p class="text-gray-500">薪资: ${job.salary.min}-${job.salary.max}K</p>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${job.tags.map(tag => '<span class="px-2 py-0.5 bg-white text-blue-700 rounded-full text-xs border border-blue-200">' + tag + '</span>').join('')}
                        </div>
                    </div>
                `;
            }
        }

        // 初始化页面
        function initPage() {
            // 获取角色信息
            const playerName = localStorage.getItem('playerName') || '玩家';
            const playerGender = localStorage.getItem('playerGender') || '未知';
            const playerSkills = JSON.parse(localStorage.getItem('playerSkills') || '[]');

            // 填充基本信息
            document.getElementById('playerName').value = playerName;
            document.getElementById('playerGender').value = playerGender;

            // 获取目标职位信息
            const jobId = getUrlParameter('jobId');
            const job = jobsData.find(j => j.id === jobId);

            const jobInfoContainer = document.getElementById('jobInfo');
            if (job) {
                const jdHTML = generateJobDetailHTML(job);
                
                jobInfoContainer.innerHTML = `
                    <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-xl p-5 border border-blue-100 mb-6">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h2 class="text-xl font-bold text-secondary">${job.title}</h2>
                                <p class="text-gray-600 mt-1">
                                    <i class="fas fa-building mr-1 text-gray-400"></i>${job.company}
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="text-xl font-bold text-accent">${job.salary.min}-${job.salary.max}K</p>
                                <p class="text-xs text-gray-500">薪资范围</p>
                            </div>
                        </div>
                        <div class="flex items-center text-sm text-gray-500 mb-4">
                            <span>
                                <i class="fas fa-map-marker-alt mr-1"></i>${job.location}
                            </span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${job.tags.map(tag => '<span class="px-3 py-1 bg-white text-blue-700 text-xs rounded-full border border-blue-200">' + tag + '</span>').join('')}
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-xl p-6 border border-gray-200">
                        ${jdHTML}
                    </div>
                `;
            } else {
                jobInfoContainer.innerHTML = `
                    <div class="bg-red-50 rounded-xl p-5 border border-red-200 text-center">
                        <i class="fas fa-exclamation-triangle text-red-400 text-2xl mb-2"></i>
                        <p class="text-red-600">未找到目标职位信息</p>
                        <button onclick="goBack()" class="mt-3 text-primary hover:underline">返回职位列表</button>
                    </div>
                `;
            }

            // 更新侧边栏
            updateSidebar(playerSkills, job);
            
            // 初始化小助手
            initAssistant();
        }

        // 返回上一页
        function goBack() {
            window.location.href = 'index.html';
        }

        // 提交简历
        function submitResume(event) {
            event.preventDefault();

            const selfIntro = document.getElementById('selfIntro').value.trim();

            if (!selfIntro) {
                alert('请填写自我介绍内容');
                return;
            }

            const playerName = localStorage.getItem('playerName') || '游客';
            const playerGender = localStorage.getItem('playerGender') || '未知';
            const playerSkills = JSON.parse(localStorage.getItem('playerSkills') || '[]');
            const jobId = getUrlParameter('jobId');

            // 保存简历信息
            const resume = {
                jobId: jobId,
                name: playerName,
                gender: playerGender,
                email: 'player@mail.com',
                skills: playerSkills,
                selfIntro: selfIntro,
                submittedAt: new Date().toISOString()
            };

            localStorage.setItem('currentResume', JSON.stringify(resume));

            // 跳转到结果页面
            window.location.href = 'result.html';
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
